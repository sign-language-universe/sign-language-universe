<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手语课后练习任务台 · 黑客松版</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b1020;color:#e8ecf8;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    line-height:1.6;font-size:15px}
  header{padding:14px 20px;background:#121a33;border-bottom:1px solid #263255;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  header h1{margin:0;font-size:17px;font-weight:600}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;background:#1d2745;
    color:#9fb0d8;border:1px solid #2c3a63}
  .tag.sim{background:#3a2a12;color:#f0b96a;border-color:#6b4a1e}
  header a{color:#8fb2ff;font-size:13px;margin-left:auto;text-decoration:none}
  header a:hover{text-decoration:underline}
  main{max-width:1180px;margin:0 auto;padding:16px 20px 50px}
  .nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .nav button{font:inherit;cursor:pointer;padding:7px 13px;border-radius:9px;
    background:#1d2745;color:#cdd8f0;border:1px solid #2c3a63}
  .nav button:hover{background:#263255}
  .nav button.on{background:#3b6ef5;color:#fff;border-color:#3b6ef5}
  .nav button.done{border-color:#2b6b47;color:#7fe0ab}
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .bar button{font:inherit;cursor:pointer;padding:6px 12px;border-radius:8px;
    background:#141d38;color:#b9c6e4;border:1px solid #263255;font-size:13px}
  .bar button.on{background:#2b3f7a;color:#fff;border-color:#3b6ef5}
  .bar button.act{background:#16402c;border-color:#2b6b47;color:#7fe0ab}
  .bar button.ghost{background:transparent;color:#8ea0c8}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .card{background:#121a33;border:1px solid #263255;border-radius:12px;padding:15px}
  .card h2{margin:0 0 8px;font-size:15px}
  .sub{color:#8ea0c8;font-size:13px;margin:0 0 10px}
  /* goal module */
  .goal-card{background:#0f1730;border:1px solid #2c3a63;border-radius:10px;padding:12px}
  .goal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .goal-title{margin:0;font-size:15px;color:#cfe0ff}
  .goal-seen{font-size:11px;padding:2px 7px;border-radius:999px;
    background:#132c20;color:#7fe0ab;border:1px solid #2b6b47}
  .goal-meta{color:#8ea0c8;font-size:12px;margin:6px 0 8px}
  .goal-stages{margin:6px 0 0;padding-left:20px;font-size:13px}
  .goal-stages li{margin:5px 0}
  .goal-nm{margin-top:12px;border-top:1px dashed #263255;padding-top:9px}
  .goal-nm-head{font-size:12px;color:#9fb0d8;margin-bottom:6px}
  .nm-group{margin:6px 0}
  .nm-label{font-size:13px;color:#c9d6f2}
  /* shared */
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;
    background:#1d2745;margin:3px 4px 0 0;color:#cdd8f0}
  .pills{margin-top:4px}
  .row{margin:9px 0}
  .rowtop{display:flex;justify-content:space-between;font-size:13px}
  .track{height:9px;background:#0b1226;border-radius:5px;overflow:hidden;margin-top:4px}
  .fill{height:100%;border-radius:5px}
  .note{font-size:13px;padding:9px 11px;border-radius:9px;background:#10203a;
    border-left:3px solid #3b6ef5;margin:8px 0}
  .note.honest{background:#2a2210;border-left-color:#e0a33c;color:#f3d9a8}
  .note.bad{background:#2a1519;border-left-color:#d95566;color:#f6c3ca}
  .advice{font-size:13px;margin:8px 0}
  /* diagnose module */
  .diagnose .overall{margin:10px 0}
  .diagnose .overall .num{font-size:32px;font-weight:700}
  /* teacher */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 7px;border-bottom:1px solid #222d4d;text-align:center}
  th{color:#9fb0d8;font-weight:600;font-size:12px}
  td.worst{background:#3a1d22;color:#f6c3ca;font-weight:600}
  td.best{background:#132c20;color:#7fe0ab}
  footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:#6d7d9f;font-size:12px}
  footer p{margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>手语课后练习任务台</h1>
  <span class="tag">黑客松 ②-06</span>
  <span class="tag">手语小宇宙</span>
  <span class="tag sim">分数为模拟演示数据</span>
  <a href="../index.html">← 返回主站（真实摄像头打分）</a>
</header>

<main>
  <div class="nav" id="nav"></div>
  <div class="bar" id="wordBar"></div>
  <div class="bar">
    <button id="btnRun" class="act">模拟一次练习</button>
    <button id="btnWhy" class="ghost">设计依据</button>
    <button id="btnReset" class="ghost">清空记录</button>
  </div>

  <div class="cols">
    <div class="card">
      <h2 id="leftTitle">目标</h2>
      <p class="sub" id="leftSub"></p>
      <div id="leftBody"></div>
    </div>
    <div class="card">
      <h2 id="rightTitle">错因</h2>
      <p class="sub" id="rightSub"></p>
      <div id="rightBody"></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2 id="reviewTitle">复盘</h2>
    <p class="sub" id="reviewSub"></p>
    <div id="review"></div>
  </div>
</main>

<footer>
  <p><b>与主站的关系：</b>练习与真实打分仍在主站「互动学习实验室」完成，需要 HTTPS 与摄像头；
    本页负责练习前后的流程层：目标、错因归类、复盘、教师下一步。</p>
  <p><b>模拟数据声明：</b>四个词的分阶段动作分解、并行非手控特征、最少可辨帧数取自线上现行教学契约，为真实数据；
    维度分数与班级矩阵为模拟演示数据。门控豁免（汽车（二）训练样本 39 条）为官方记录的真实设定。</p>
</footer>

<script src="coach-goal.js"></script>
<script src="coach-diagnose.js"></script>
<script src="coach-review.js"></script>
<script>
var RAW = {
  chaoshi: { word:'超市', overall:74, dims:[
    {n:'把手手形', s:58, c:0.71},
    {n:'左右交替顺序', s:74, c:0.66},
    {n:'推动轨迹', s:88, c:0.74},
    {n:'双手入画', s:null, c:0.06}]},
  gongjiao: { word:'公交车', overall:79, dims:[
    {n:'把手手形', s:63, c:0.68},
    {n:'前后晃动次数', s:86, c:0.72},
    {n:'晃动幅度', s:80, c:0.64}]},
  qiche1: { word:'汽车（一）', overall:73, dims:[
    {n:'把手手形', s:71, c:0.70},
    {n:'双手协同', s:66, c:0.31},
    {n:'转动轨迹', s:84, c:0.73}]},
  qiche2: { word:'汽车（二）', overall:null, dims:[
    {n:'方块手形', s:null, c:null},
    {n:'移动中保持形状', s:null, c:null}]}
};

var STEPS = [
  {k:'goal',  n:'目标'},
  {k:'train', n:'练习'},
  {k:'cause', n:'错因'},
  {k:'review',n:'复盘'},
  {k:'teach', n:'教师'}
];

var st = { word:'chaoshi', step:'goal', diag:null, ran:false, why:false };

function el(id){ return document.getElementById(id); }

function renderNav(){
  var h='';
  STEPS.forEach(function(s,i){
    var cls='';
    var order=['goal','train','cause','review','teach'];
    var cur=order.indexOf(st.step), mine=i;
    if(mine<cur) cls='done';
    if(s.k===st.step) cls='on';
    h+='<button data-step="'+s.k+'" class="'+cls+'">'+(i+1)+'. '+s.n+'</button>';
  });
  el('nav').innerHTML=h;
}

function renderWordBar(){
  var h='';
  var keys=['chaoshi','gongjiao','qiche1','qiche2'];
  keys.forEach(function(k){
    var zh = (window.CoachGoal && CoachGoal.WORDS[k]) ? CoachGoal.WORDS[k].zh : k;
    h+='<button data-w="'+k+'" class="'+(k===st.word?'on':'')+'">'+zh+'</button>';
  });
  el('wordBar').innerHTML=h;
}

function renderGoalPanel(){
  el('leftTitle').textContent='目标 · 今天练什么';
  el('leftSub').textContent='系统按弱项推荐，不按词表顺序。教学契约提到练习之前。';
  if(!window.CoachGoal){ el('leftBody').innerHTML='<div class="note bad">目标模块未加载</div>'; return; }
  var hist=loadHist();
  var pick=CoachGoal.pickTodayWord(hist);
  var key=st.word || pick.key;
  var seen=CoachGoal.goalComplete(hist,key);
  var card=CoachGoal.renderGoalCard(key,{done:seen});
  el('leftBody').innerHTML=
    '<div class="note">推荐：'+(pick.reason||'')+'</div>'+card;
}

function renderTrainPanel(){
  el('rightTitle').textContent='练习 · 两种方式';
  el('rightSub').textContent='真实打分请在主站完成，本页可模拟走通流程。';
  el('rightBody').innerHTML=
    '<div class="note"><b>真实练习：</b>点右上角「返回主站」，进互动学习实验室。'+
    '需要摄像头权限与模型预热，视频不出浏览器。</div>'+
    '<div class="note honest"><b>模拟练习：</b>点上方「模拟一次练习」，'+
    '用演示分数走通 错因→复盘，不依赖摄像头。</div>';
}

function renderCausePanel(){
  el('rightTitle').textContent='错因 · 四态归类';
  el('rightSub').textContent='做错词 / 做得不标准 / 双手未入画 / 样本不足不出分。';
  if(!st.diag){
    el('rightBody').innerHTML='<div class="note">还没有结果。点「模拟一次练习」。</div>';
    return;
  }
  if(!window.CoachDiagnose){ el('rightBody').innerHTML='<div class="note bad">错因模块未加载</div>'; return; }
  el('rightBody').innerHTML=CoachDiagnose.renderDiagnose(st.diag,{showWhy:st.why});
}

function renderReviewPanel(){
  el('reviewTitle').textContent='复盘 · 跨词弱项';
  el('reviewSub').textContent='只存维度分数，不存视频、面部关键点与身份。';
  if(!window.CoachReview){ el('review').innerHTML='<div class="note bad">复盘模块未加载</div>'; return; }
  el('review').innerHTML=CoachReview.renderReview(loadHist(),{});
}

function seed(i,j){
  var x=Math.sin((i+1)*12.9898+(j+1)*78.233)*43758.5453;
  return x-Math.floor(x);
}
var GROUPS=['手形','双手关系','轨迹','重复次数'];

function renderTeacherPanel(){
  el('rightTitle').textContent='教师 · 班级维度聚合';
  el('rightSub').textContent='只看维度，不看录像。';
  var rows=[];
  for(var i=0;i<30;i++){
    var r={name:'S'+(i+1)};
    GROUPS.forEach(function(g,j){
      var base=55+seed(i,j)*40;
      if(g==='手形') base-=17;
      r[g]=Math.max(28,Math.min(99,Math.round(base)));
    });
    rows.push(r);
  }
  var avg={};
  GROUPS.forEach(function(g){
    avg[g]=Math.round(rows.reduce(function(a,r){return a+r[g];},0)/rows.length);
  });
  var worst=GROUPS[0], best=GROUPS[0];
  GROUPS.forEach(function(g){
    if(avg[g]<avg[worst]) worst=g;
    if(avg[g]>avg[best]) best=g;
  });
  var h='<div class="note">教师不看 30 段录像。AI 只把维度按班聚合，'+
        '告诉老师明天课上示范什么。</div>';
  h+='<h3 class="goal-meta">班级维度均分（30 人，模拟演示数据）</h3>';
  h+='<table><tr><th>学习者</th>';
  GROUPS.forEach(function(g){h+='<th>'+g+'</th>';});
  h+='</tr>';
  rows.slice(0,10).forEach(function(r){
    h+='<tr><td>'+r.name+'</td>';
    GROUPS.forEach(function(g){
      var cls=(g===worst)?'worst':((g===best)?'best':'');
      h+='<td class="'+cls+'">'+r[g]+'</td>';
    });
    h+='</tr>';
  });
  h+='<tr><td><b>班级均分</b></td>';
  GROUPS.forEach(function(g){
    var cls=(g===worst)?'worst':((g===best)?'best':'');
    h+='<td class="'+cls+'"><b>'+avg[g]+'</b></td>';
  });
  h+='</tr></table>';
  h+='<div class="note"><b>全班在「'+worst+'」这一列系统性偏低（均分 '+avg[worst]+'）。</b>'+
     '建议课上集体示范含该维度的词：超市、公交车、汽车（一）。</div>';
  h+='<div class="note">老师看到的只有维度分数：没有视频、没有面部关键点、没有身份标识。</div>';
  el('rightBody').innerHTML=h;
}

function loadHist(){
  if(window.CoachReview) return CoachReview.loadHistory();
  try{ return JSON.parse(localStorage.getItem('slu_taskboard_v1')||'[]'); }catch(e){ return []; }
}

function pushAttempt(raw){
  if(window.CoachReview){ CoachReview.pushAttempt({
    word:raw.word, ts:Date.now(), overall:raw.overall,
    gateState:'normal', dims:raw.dims
  }); return; }
  var h=loadHist();
  h.push({word:raw.word,ts:Date.now(),overall:raw.overall,gateState:'normal',dims:raw.dims});
  localStorage.setItem('slu_taskboard_v1',JSON.stringify(h));
}

function render(){
  renderNav();
  renderWordBar();
  if(st.step==='goal'){ renderGoalPanel(); renderTrainPanel(); }
  else if(st.step==='train'){ renderGoalPanel(); renderTrainPanel(); }
  else if(st.step==='cause'){ renderGoalPanel(); renderCausePanel(); }
  else if(st.step==='teach'){ renderGoalPanel(); renderTeacherPanel(); }
  else { renderGoalPanel(); renderCausePanel(); }
  renderReviewPanel();
}

function runOnce(){
  var raw=RAW[st.word];
  st.diag=raw;
  st.ran=true;
  pushAttempt(raw);
  if(window.CoachGoal) CoachGoal.markGoalSeen(st.word);
  st.step='cause';
  render();
}

document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;
  if(!b) return;
  if(b.dataset.w){
    st.word=b.dataset.w; st.diag=null; st.ran=false;
    if(window.CoachGoal) CoachGoal.markGoalSeen(st.word);
  } else if(b.dataset.step){
    st.step=b.dataset.step;
    if(b.dataset.step==='cause' && !st.diag) st.diag=RAW[st.word];
  } else if(b.id==='btnRun'){
    runOnce();
  } else if(b.id==='btnWhy'){
    st.why=!st.why;
  } else if(b.id==='btnReset'){
    localStorage.removeItem('slu_taskboard_v1');
    st.diag=null; st.ran=false; st.step='goal';
  }
  render();
});

render();
</script>
</body>
</html>
